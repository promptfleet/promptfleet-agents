[package]
name = "pf_test_harness"
version = "0.1.0"
edition = "2021"
description = "Reusable native test harness for PromptFleet streaming and SSE seams"

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
serde_json = { workspace = true }
futures = { workspace = true }
futures-util = "0.3"
llm_client = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
bytes = { workspace = true }
http = "1"
http-body = "1"
http-body-util = "0.1"

# Optional integrations
agent_sdk = { workspace = true, default-features = false, features = ["llm-engine", "event-stream", "test-support"], optional = true }
a2a_protocol_core = { workspace = true, features = ["streaming"], optional = true }
a2a_http_server = { workspace = true, features = ["streaming"], optional = true }
axum = { version = "0.7", optional = true }
tower = { version = "0.5", features = ["util"], optional = true }
tokio-stream = { version = "0.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }

[features]
default = []
scenario = ["dep:agent_sdk"]
sse = []
agent-sdk = ["scenario", "sse", "dep:agent_sdk", "dep:a2a_protocol_core", "dep:axum"]
a2a-http = ["sse", "dep:a2a_http_server", "dep:a2a_protocol_core", "dep:axum", "dep:tower"]
a2a-mock = ["sse", "dep:a2a_protocol_core", "dep:axum", "dep:tokio-stream", "dep:reqwest"]
