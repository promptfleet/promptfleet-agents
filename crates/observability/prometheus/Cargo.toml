[package]
name = "pf_prometheus"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Prometheus metrics integration for the PromptFleet observability stack"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["structured-logging"]
prometheus-federation = ["prometheus_crate", "reqwest", "uuid", "serde_json"]
pushgateway-client = ["prometheus-federation"]
cardinality-reduction = ["prometheus-federation", "url"]
recording-rules = ["prometheus-federation", "serde_yaml"]
structured-logging = ["serde_json", "observability_core/structured-logging"]

[dependencies]
# Core observability
observability_core = { workspace = true }

# Core dependencies only - extension system removed
log = "0.4"

# Prometheus dependencies (feature-gated)
prometheus_crate = { package = "prometheus", version = "0.13", optional = true }

# Core dependencies
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", optional = true }
serde_yaml = { version = "0.9", optional = true }

# WASM-compatible time and async
web-time = "1.0"
futures = "0.3"

# HTTP client for push gateway (SpinKube native async)
reqwest = { version = "0.12", features = ["json"], optional = true }

# String interning for cardinality reduction
string-interner = "0.17"

# Hash collections for performance
indexmap = "2.0"
hashbrown = "0.14"

# URL parsing for cardinality optimization
url = { version = "2.5", optional = true }

# UUID generation for span tracking
uuid = { version = "1.0", features = ["v4", "serde"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
# Tokio only for test execution
tokio = { version = "1.0", features = ["rt", "time", "macros", "test-util"] } 
