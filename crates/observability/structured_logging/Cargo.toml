[package]
name = "structured_logging"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Enhanced structured logging with performance optimizations and convenience APIs for SpinKube agents"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["convenience"]

# Core features
convenience = ["llm-logging", "template-logging", "a2a-logging"]
performance-optimized = ["string-interner", "buffer-pool", "fast-paths"]
correlation-enhanced = ["baggage-support", "scoped-context"]

# Specific feature components
llm-logging = []
template-logging = []
a2a-logging = []
string-interner = ["string-interner-crate"]
buffer-pool = []
fast-paths = []
baggage-support = ["uuid"]
scoped-context = []

# Integration features
wasm-optimized = ["performance-optimized"]

[dependencies]
# 🏛️ FOUNDATION - Reuse excellent observability_core architecture
observability_core = { workspace = true, features = ["structured-logging"] }

# 🚀 PERFORMANCE DEPENDENCIES (feature-gated)
string-interner-crate = { package = "string-interner", version = "0.17", optional = true }

# 🔗 CORRELATION DEPENDENCIES (feature-gated)
uuid = { workspace = true, optional = true, features = ["v4", "serde"] }

# Core dependencies (always available)
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }  # For panic handler timestamps
web-time = "1.0"

# Standard library integration  
log = { version = "0.4", features = ["kv"] }

# Core dependencies only - extension system removed

# WASM compatibility
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt"] } 