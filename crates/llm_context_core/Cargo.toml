[package]
name = "pf_llm_context_core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WASM-compatible LLM context window management — token estimation, budget tracking, history strategies, and memory traits"

[lib]
name = "llm_context_core"
crate-type = ["rlib"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt"] }

[features]
default = []
