[package]
name = "a2a_http_client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "A2A HTTP client - WASM default, native testing support"

[dependencies]
# Core (always included)
protocol_transport_core = { workspace = true }
a2a_protocol_core = { workspace = true }

# Optional observability (OTLP push via observability facade)
observability = { workspace = true, optional = true, features = ["otel"] }

# Minimal serialization
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
web-time = { workspace = true }

# UUID for request IDs
uuid = { workspace = true, features = ["v4"] }

# WASM-only deps (Spin SDK for HTTP)
[target.'cfg(target_arch = "wasm32")'.dependencies]
spin-sdk = "5.2"

# Native-only deps (Reqwest for HTTP)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = { version = "0.3", optional = true }
async-stream = { version = "0.3", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[features]
default = []

# Optional: emit OTEL spans/metrics + W3C propagation.
observability = ["dep:observability"]
streaming = ["dep:futures-util", "dep:async-stream", "a2a_protocol_core/event-stream"]

[lib]
name = "a2a_http_client"
crate-type = ["cdylib", "rlib"] 
