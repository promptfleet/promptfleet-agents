[package]
name = "pf-types"
version = "0.1.0"
edition = "2021"
description = "PromptFleet shared identifier and naming types (AgentId, TenantId, SpaceId, AgentSlug), labels and key builders."
license = "MIT OR Apache-2.0"

[features]
default = ["serde"]
serde = ["dep:serde"]
schemars = ["dep:schemars"]

[dependencies]
ulid = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }
schemars = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
