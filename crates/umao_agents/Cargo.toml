[package]
name = "umao_agents"
version = "0.1.0"
edition.workspace = true
description = "UMAO coordination for promptfleet A2A agents — AsyncNodeExecutor backed by agent_sdk."
keywords = ["umao", "promptfleet", "coordination", "multi-agent", "a2a"]
categories = ["network-programming", "asynchronous"]

[dependencies]
umao_core = { path = "../../../umao-rs/crates/umao_core" }
umao_executor = { path = "../../../umao-rs/crates/umao_executor" }
agent_sdk = { workspace = true, features = ["a2a-client"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
