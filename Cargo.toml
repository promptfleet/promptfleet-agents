[workspace]
resolver = "2"
members = [
    # Foundation / Transport
    "crates/foundation_utils",
    "crates/protocol_transport_core",

    # Agent Core
    "crates/agent_core",

    # A2A Protocol
    "crates/a2a_protocol_core",
    "crates/a2a_http_client",
    "crates/a2a_http_server",
    "crates/a2a_app_ports",
    "crates/a2a_rpc_macros",

    # LLM
    "crates/llm/llm_client",
    "crates/llm_context_core",
    "crates/llm_tools",
    "crates/llm_tools/tool_web_search",
    "crates/llm_tool_macros",

    # Observability
    "crates/observability/observability",
    "crates/observability/observability_core",
    "crates/observability/structured_logging",
    "crates/observability/otel",
    "crates/observability/prometheus",

    # MCP
    "crates/mcp_protocol",

    # Macros / Types
    "crates/pf_macros",
    "crates/commons/pf-types",
    "crates/commons/pf-events",

    # Config
    "crates/config/pf_config",

    # SDK
    "crates/agent_sdk",

    # UMAO
    "crates/umao_agents",

    # Test Harness
    "crates/pf_test_harness",

    # Examples
    "examples/a2a-echo-native",
    "examples/umao-local-orchestration",
]

exclude = [
    "examples/a2a-echo-wasm",
]

[workspace.package]
edition = "2024"
version = "0.1.1"
rust-version = "1.85"
repository = "https://github.com/promptfleet/promptfleet-agents"
license = "Apache-2.0"

[workspace.dependencies]
# ── Internal crates ──
agent_core = { package = "pf_agent_core", path = "crates/agent_core", version = "0.1.0" }
agent_sdk = { package = "pf_agent_sdk", path = "crates/agent_sdk", version = "0.1.0", default-features = false }
a2a_protocol_core = { path = "crates/a2a_protocol_core", version = "0.1.0" }
a2a_http_client = { path = "crates/a2a_http_client", version = "0.1.0" }
a2a_http_server = { path = "crates/a2a_http_server", version = "0.1.0" }
a2a_app_ports = { path = "crates/a2a_app_ports", version = "0.1.0" }
a2a_rpc_macros = { path = "crates/a2a_rpc_macros", version = "0.1.0" }
protocol_transport_core = { path = "crates/protocol_transport_core", version = "0.1.0" }
foundation_utils = { package = "pf_foundation_utils", path = "crates/foundation_utils", version = "0.1.0" }
observability = { package = "pf_observability", path = "crates/observability/observability", version = "0.1.0" }
observability_core = { package = "pf_observability_core", path = "crates/observability/observability_core", version = "0.1.0" }
structured_logging = { package = "pf_structured_logging", path = "crates/observability/structured_logging", version = "0.1.0" }
llm_client = { package = "pf_llm_client", path = "crates/llm/llm_client", version = "0.1.0" }
llm_context_core = { package = "pf_llm_context_core", path = "crates/llm_context_core", version = "0.1.0" }
llm_tools = { package = "pf_llm_tools", path = "crates/llm_tools", version = "0.1.0" }
llm_tool_macros = { package = "pf_llm_tool_macros", path = "crates/llm_tool_macros", version = "0.1.0" }
tool_web_search = { package = "pf_tool_web_search", path = "crates/llm_tools/tool_web_search", version = "0.1.0" }
mcp_protocol = { package = "pf_mcp_protocol", path = "crates/mcp_protocol", version = "0.1.0" }
pf_config = { path = "crates/config/pf_config", version = "0.1.0" }
pf_macros = { path = "crates/pf_macros", version = "0.1.0" }
pf-types = { path = "crates/commons/pf-types", version = "0.1.0" }
pf_test_harness = { path = "crates/pf_test_harness", version = "0.1.0" }
umao_core = { version = "0.1.0" }
umao_executor = { version = "0.1.0" }

# ── External dependencies ──
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.141"
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "v5", "js"] }
indexmap = "2.0"
web-time = "1.0"
log = "0.4"
tracing = "0.1"
tracing-subscriber = "0.3"
futures = "0.3"
http = "1.0"
bytes = "1.0"
async-trait = "0.1"
spin-sdk = "5.2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
schemars = { version = "0.8", features = ["derive"] }
jsonschema = { version = "0.18", default-features = false }
opentelemetry = "0.21"
opentelemetry-otlp = "0.14"
opentelemetry-semantic-conventions = "0.13"
prometheus = "0.13"
string-interner = "0.17"
env_logger = "0.11"

# ── Profiles ──

# Dev: fast local iteration
[profile.dev]
split-debuginfo = "unpacked"  # skip debuginfo in linker → much faster linking on macOS

[profile.dev.package."*"]
opt-level = 1  # optimize third-party deps → tests run 3-10x faster, one-time compile cost

# Release: WASM production (fat LTO, smallest binary)
[profile.release]
lto = "fat"
opt-level = "z"
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = false
debug-assertions = false
incremental = false

# Local release: local --release iteration (incremental, debuggable)
[profile.local-release]
inherits = "release"
lto = "thin"
opt-level = 2
codegen-units = 8
split-debuginfo = "unpacked"
incremental = true
debug = "line-tables-only"

# WASM-specific optimization profile
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
