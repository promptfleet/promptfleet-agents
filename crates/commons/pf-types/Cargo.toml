[package]
name = "pf-types"
version = "0.2.0"
edition = "2021"
description = "Lightweight naming and validation primitives for the PromptFleet agent ecosystem (AgentSlug, normalize_name)."
license = "MIT OR Apache-2.0"

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true, features = ["derive"] }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
