[package]
name = "pf-types"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lightweight naming and validation primitives for the PromptFleet agent ecosystem (AgentSlug, normalize_name)."

[features]
default = ["serde"]
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true, features = ["derive"] }
