[package]
name = "umao_agents"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "UMAO coordination for promptfleet A2A agents — AsyncNodeExecutor backed by agent_sdk."
keywords = ["umao", "promptfleet", "coordination", "multi-agent", "a2a"]
categories = ["network-programming", "asynchronous"]

[dependencies]
umao_core = { workspace = true }
umao_executor = { workspace = true }
agent_sdk = { workspace = true, features = ["a2a-client"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "net"] }
