[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "promptfleet-service-account-auth"
version = "0.1.0"
description = "PromptFleet service-account OAuth and invoke-token client"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
pem = ["cryptography>=44"]
test = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/promptfleet_auth"]
