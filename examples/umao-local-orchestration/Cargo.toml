[package]
name = "umao-local-orchestration"
version = "0.1.0"
edition = "2024"
publish = false
description = "UMAO local orchestration demo — two A2A agents + graph-driven orchestrator."

[[bin]]
name = "researcher"
path = "src/researcher.rs"

[[bin]]
name = "synthesizer"
path = "src/synthesizer.rs"

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[dependencies]
umao_core = { path = "../../../umao-rs/crates/umao_core" }
umao_executor = { path = "../../../umao-rs/crates/umao_executor" }
umao_agents = { path = "../../crates/umao_agents" }
a2a_http_server = { path = "../../crates/a2a_http_server" }
a2a_protocol_core = { path = "../../crates/a2a_protocol_core" }
agent_sdk = { path = "../../crates/agent_sdk", features = ["a2a-client"] }

serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
