name: PR CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  pr-title-check:
    name: Conventional Commit title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            test
            refactor
            perf
            ci
            build
            style
            revert

  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - '.cargo/**'
              - 'release-plz.toml'
            docs:
              - 'docs/**'

  fmt:
    name: Format
    needs: changes
    if: always() && (needs.changes.outputs.rust == 'true' || needs.changes.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  clippy:
    name: Clippy
    needs: changes
    if: always() && (needs.changes.outputs.rust == 'true' || needs.changes.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked

  test:
    name: Tests
    needs: changes
    if: always() && (needs.changes.outputs.rust == 'true' || needs.changes.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  wasm-check:
    name: WASM check
    needs: changes
    if: always() && (needs.changes.outputs.rust == 'true' || needs.changes.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: Check WASM targets
        run: |
          cargo check --target wasm32-wasip1 --locked \
            --workspace \
            --exclude pf_test_harness \
            --exclude a2a-echo-native

  publish-dry-run:
    name: Publish dry-run
    needs: changes
    if: always() && (needs.changes.outputs.rust == 'true' || needs.changes.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo publish --dry-run -p pf_foundation_utils

  docs-build:
    name: Docs build
    needs: changes
    if: always() && (needs.changes.outputs.docs == 'true' || needs.changes.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        working-directory: docs
        run: yarn install --immutable
      - name: Build site
        working-directory: docs
        run: yarn build
