[package]
name = "a2a_rpc_macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false
description = "Proc-macro for automatic A2A JSON-RPC command registration - WASM optimized with async support"

[lib]
proc-macro = true
doctest = false

[dependencies]
# Proc-macro essentials
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full", "extra-traits"] }

# Code generation
serde_json = { workspace = true }

[features]
default = []
# Feature for generating build scripts automatically
build-script-gen = [] 
