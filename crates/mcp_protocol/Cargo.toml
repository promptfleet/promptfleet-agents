[package]
name = "pf_mcp_protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Model Context Protocol (MCP) implementation for PromptFleet - JSON-RPC 2.0 compatible"

[dependencies]
# Protocol transport foundation
protocol_transport_core = { workspace = true }

# Spin SDK for HTTP handling
spin-sdk = "5.2"

# Core serialization
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"

# Logging facade
log = { workspace = true }

# UUID for correlation tracking
uuid = { workspace = true, features = ["v4"] }


[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }

[lib]
name = "mcp_protocol"
crate-type = ["cdylib", "rlib"]

[features]
default = ["client", "server", "proxy"]
client = []
server = []
proxy = []
# Direct SSE client - avoids proxy hop for performance
sse-client = ["client"]
# Direct SSE server - accepts direct SSE connections
sse-server = ["server"]

# Examples only
[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] } 
axum = { version = "0.7" }
